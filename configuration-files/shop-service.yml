server:
  port: 20000
discount: 30
api:
  payments: http://PAYMENTS-SERVICE/payments
spring:
  cloud:
    function:
      definition: paymentEventConsumer
    stream:
      bindings:
        paymentEventConsumer-in-0:
          destination: payment-events
          group: ${random.uuid} #shop
          properties:
            spring.json.trusted.packages: pl.training.payments.adapters.events